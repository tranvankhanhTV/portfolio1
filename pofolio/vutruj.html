<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>3D Universe Background</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: black;
    }
    canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1; /* background website */
    }
</style>
</head>
<body>

<!-- THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<!-- Post-processing scripts -->
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
/* =========================
   BASIC SETUP
========================= */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
);
camera.position.set(0, 20, 80);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* =========================
   CONTROLS (ZOOM + ROTATE)
========================= */
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enableZoom = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;

/* =========================
   LIGHT
========================= */
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const sunLight = new THREE.PointLight(0xffee88, 2.5, 500);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

/* =========================
   SUN
========================= */
const sun = new THREE.Mesh(
    new THREE.SphereGeometry(6, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xffcc33 })
);
scene.add(sun);

/* =========================
   PLANETS ORBIT
========================= */
const planets = [];

function createPlanet(size, distance, speed, color, ring) {
    const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(size, 32, 32),
        new THREE.MeshStandardMaterial({ color })
    );

    if (ring) {
        const ringGeo = new THREE.RingGeometry(ring.inner, ring.outer, 32);
        const ringMat = new THREE.MeshBasicMaterial({
            color: ring.color,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.4
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = -Math.PI / 2; // Xoay ngang
        mesh.add(ringMesh);
    }

    scene.add(mesh);
    planets.push({ mesh, distance, angle: Math.random() * Math.PI * 2, speed });
}

createPlanet(2, 15, 0.01, 0x3399ff);
createPlanet(3, 25, 0.006, 0xff5533);
createPlanet(2.5, 35, 0.004, 0x66ff66);
createPlanet(4, 50, 0.002, 0xaa66ff, { inner: 5, outer: 8, color: 0xffccff }); // Hành tinh có vành đai

/* =========================
   GALAXY SPIRAL
========================= */
const galaxyGeometry = new THREE.BufferGeometry();
const galaxyCount = 12000;
const positions = [];

for (let i = 0; i < galaxyCount; i++) {
    const radius = Math.random() * 500;
    const angle = radius * 0.04;
    positions.push(
        Math.cos(angle) * radius,
        (Math.random() - 0.5) * 20,
        Math.sin(angle) * radius
    );
}

galaxyGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
);

const galaxy = new THREE.Points(
    galaxyGeometry,
    new THREE.PointsMaterial({
        color: 0xffffff,
        size: 1,
        transparent: true
    })
);
scene.add(galaxy);

/* =========================
   NEBULA (CLOUDS)
========================= */
function createCloudTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 32, 32);
    const texture = new THREE.Texture(canvas);
    texture.needsUpdate = true;
    return texture;
}

const nebulaGeometry = new THREE.BufferGeometry();
const nebulaCount = 500; // Số lượng đám mây
const nPositions = [];
const nColors = [];

for (let i = 0; i < nebulaCount; i++) {
    // Phân bố ngẫu nhiên xung quanh
    const r = 200 + Math.random() * 600;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI;

    nPositions.push(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.sin(phi) * Math.sin(theta),
        r * Math.cos(phi)
    );

    // Màu sắc ngẫu nhiên (Tím, Xanh, Hồng)
    const color = new THREE.Color();
    // HSL: Hue (0.6-0.9 = Blue to Pink), Saturation, Lightness
    color.setHSL(0.6 + Math.random() * 0.3, 0.8, 0.4);
    nColors.push(color.r, color.g, color.b);
}

nebulaGeometry.setAttribute('position', new THREE.Float32BufferAttribute(nPositions, 3));
nebulaGeometry.setAttribute('color', new THREE.Float32BufferAttribute(nColors, 3));

const nebulaMaterial = new THREE.PointsMaterial({
    size: 80,
    map: createCloudTexture(),
    vertexColors: true,
    transparent: true,
    opacity: 0.15,
    depthWrite: false,
    blending: THREE.AdditiveBlending
});

const nebula = new THREE.Points(nebulaGeometry, nebulaMaterial);
scene.add(nebula);

/* =========================
   STARS (TWINKLING)
========================= */
function createStars(count, size) {
    const geometry = new THREE.BufferGeometry();
    const positions = [];
    for (let i = 0; i < count; i++) {
        // Random position on a sphere surface (far away)
        const r = 600 + Math.random() * 1000; 
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        
        positions.push(
            r * Math.sin(phi) * Math.cos(theta),
            r * Math.sin(phi) * Math.sin(theta),
            r * Math.cos(phi)
        );
    }
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({
        color: 0xffffff,
        size: size * 1.5,
        transparent: true
    });
    const mesh = new THREE.Points(geometry, material);
    scene.add(mesh);
    return { mesh, material };
}

const stars1 = createStars(1500, 1.5); // Small stars
const stars2 = createStars(500, 2.5);  // Big stars

/* =========================
   SHOOTING STAR (VỆT SAO BĂNG)
========================= */
// Tạo hình dáng vệt sao băng (đầu to đuôi nhỏ)
const shootGeo = new THREE.CylinderGeometry(0.2, 0, 60, 8);
shootGeo.rotateX(Math.PI / 2); // Xoay để hướng theo trục Z (hướng di chuyển)
const shootMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const shootingStar = new THREE.Mesh(shootGeo, shootMat);
scene.add(shootingStar);

shootingStar.position.y = -1000; // Ẩn ban đầu
let isShooting = false;
let shootVelocity = new THREE.Vector3();

function spawnShootingStar() {
    const r = 350; // Khoảng cách xuất hiện
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI;
    
    // Vị trí xuất hiện ngẫu nhiên trên mặt cầu
    shootingStar.position.set(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.sin(phi) * Math.sin(theta),
        r * Math.cos(phi)
    );
    
    // Bay về phía ngẫu nhiên gần trung tâm
    const target = new THREE.Vector3((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100);
    shootingStar.lookAt(target);
    
    // Tính vận tốc
    shootVelocity.subVectors(target, shootingStar.position).normalize().multiplyScalar(10 + Math.random() * 10);
    isShooting = true;
}

/* =========================
   POST-PROCESSING (BLOOM)
========================= */
const renderScene = new THREE.RenderPass(scene, camera);

const bloomPass = new THREE.UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.5, 0.4, 0.85
);
bloomPass.strength = 2.5; // Độ mạnh của ánh sáng (Glow strength)
bloomPass.radius = 0.4;   // Bán kính tỏa sáng
bloomPass.threshold = 0;  // Ngưỡng sáng (0 = tất cả vật thể sáng đều glow)

const composer = new THREE.EffectComposer(renderer);
composer.addPass(renderScene);
composer.addPass(bloomPass);

/* =========================
   PARALLAX MOUSE
========================= */
let mouseX = 0, mouseY = 0;

document.addEventListener("mousemove", e => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

/* =========================
   ANIMATE
========================= */
function animate() {
    requestAnimationFrame(animate);

    const time = Date.now() * 0.001;

    // Twinkle stars
    stars1.material.opacity = 0.5 + Math.sin(time * 0.5) * 0.4;
    stars2.material.opacity = 0.5 + Math.cos(time * 0.8) * 0.4;
    
    // Rotate stars
    stars1.mesh.rotation.y += 0.0001;
    stars2.mesh.rotation.y += 0.0002;

    // Sun rotate
    sun.rotation.y += 0.003;

    // Planet orbit
    planets.forEach(p => {
        p.angle += p.speed;
        p.mesh.position.set(
            Math.cos(p.angle) * p.distance,
            0,
            Math.sin(p.angle) * p.distance
        );
        p.mesh.rotation.y += 0.01;
    });

    // Galaxy rotate
    galaxy.rotation.y += 0.0008;

    // Nebula rotate
    nebula.rotation.y -= 0.0005;

    // Shooting star animation
    if (isShooting) {
        shootingStar.position.add(shootVelocity);
        // Nếu bay quá xa thì reset
        if (shootingStar.position.length() > 600) {
            isShooting = false;
            shootingStar.position.y = -1000;
        }
    } else if (Math.random() < 0.008) { // Tỉ lệ xuất hiện ngẫu nhiên
        spawnShootingStar();
    }

    // Parallax
    camera.position.x += mouseX * 0.5;
    camera.position.y += -mouseY * 0.5;

    controls.update();
    composer.render();
}

animate();

/* =========================
   RESPONSIVE
========================= */
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
